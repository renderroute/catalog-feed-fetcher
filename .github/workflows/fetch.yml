name: Fetch public catalogs

# Production fetch runner (unlimited public Actions minutes).
# Store list is NOT hardcoded for nightly runs — a private orchestrator (or WP Run Import)
# passes retailer key + base_url + platform. This repo must stay anonymous: no site tokens.

on:
  workflow_dispatch:
    inputs:
      store:
        description: 'Retailer key (required with base_url + platform for production)'
        required: false
        default: ''
      base_url:
        description: 'Store origin URL (e.g. https://example.com). Empty = legacy stores.yml lookup by key.'
        required: false
        default: ''
      platform:
        description: 'shopify | shopify_products_json | woocommerce'
        required: false
        default: ''
      stores_json:
        description: 'JSON array of {key, base_url, platform} from the private orchestrate job'
        required: false
        default: ''
  repository_dispatch:
    types: [fetch-catalogs]

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare dynamic store list
        id: prep
        run: |
          set -euo pipefail
          mkdir -p .out /tmp/catalog-fetch

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          name = os.environ.get("GITHUB_EVENT_NAME") or ""
          out = Path(os.environ["GITHUB_OUTPUT"])
          path = Path("/tmp/catalog-fetch/stores.json")

          def write_batch(stores, mode: str) -> None:
              if not isinstance(stores, list) or not stores:
                  raise SystemExit(f"{mode}: stores must be a non-empty list")
              path.write_text(json.dumps(stores), encoding="utf-8")
              print(f"{mode} stores: {len(stores)}")
              with out.open("a", encoding="utf-8") as fh:
                  fh.write(f"mode={mode}\n")
                  fh.write(f"stores_json={path}\n")
                  fh.write("store=\n")
                  fh.write("base_url=\n")
                  fh.write("platform=\n")

          if name == "repository_dispatch":
              write_batch((event.get("client_payload") or {}).get("stores"), "repository_dispatch")
              raise SystemExit(0)

          inputs = event.get("inputs") or {}
          raw = (inputs.get("stores_json") or "").strip()
          if raw:
              stores = json.loads(raw)
              write_batch(stores, "stores_json")
              raise SystemExit(0)

          store = (inputs.get("store") or "").strip()
          base = (inputs.get("base_url") or "").strip()
          platform = (inputs.get("platform") or "").strip()
          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"store={store}\n")
              fh.write(f"base_url={base}\n")
              fh.write(f"platform={platform}\n")
              if store and base and platform:
                  fh.write("mode=inline\n")
                  fh.write("stores_json=\n")
              elif store:
                  fh.write("mode=stores_yml\n")
                  fh.write("stores_json=\n")
              else:
                  raise SystemExit(
                      "Provide stores_json, or store+base_url+platform, or store only (legacy stores.yml)."
                  )
          PY

      - name: Fetch fast catalogs
        id: fetch_fast
        run: |
          set -euo pipefail
          MODE="${{ steps.prep.outputs.mode }}"
          mkdir -p .out
          set +e
          if [ "$MODE" = "repository_dispatch" ] || [ "$MODE" = "stores_json" ]; then
            python -m src.fetch_all --out-dir .out --phase fast --stores-json "${{ steps.prep.outputs.stores_json }}"
          elif [ "$MODE" = "inline" ]; then
            python -m src.fetch_all --out-dir .out --phase fast \
              --inline-store "${{ steps.prep.outputs.store }}" \
              --base-url "${{ steps.prep.outputs.base_url }}" \
              --platform "${{ steps.prep.outputs.platform }}"
          else
            python -m src.fetch_all --out-dir .out --phase fast --store "${{ steps.prep.outputs.store }}"
          fi
          set -e
          ls -la .out || true
          python - <<'PY'
          import json
          from pathlib import Path
          st = {}
          p = Path(".out/_fetch_status.json")
          if p.exists():
              st = json.loads(p.read_text(encoding="utf-8"))
          ok = int(st.get("ok") or 0)
          failed = int(st.get("failed") or 0)
          deferred = st.get("deferred_keys") or []
          print(f"fast status ok={ok} deferred={len(deferred)} failed={failed}")
          Path("/tmp/slow-count").write_text(str(len(deferred)), encoding="utf-8")
          keys = Path(".out/_bridge_keys.txt")
          print(f"fast bridge keys: {(keys.read_text(encoding='utf-8') if keys.exists() else '')}")
          PY
          echo "slow_count=$(cat /tmp/slow-count)" >> "$GITHUB_OUTPUT"
          echo "bridge_keys=$(cat .out/_bridge_keys.txt 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Push fast catalogs to staging
        id: staging_fast
        if: steps.fetch_fast.outcome == 'success'
        env:
          STAGING_PUSH_TOKEN: ${{ secrets.STAGING_PUSH_TOKEN }}
          STAGING_REPO: ${{ secrets.STAGING_REPO }}
          STAGING_BRANCH: ${{ secrets.STAGING_BRANCH }}
        run: bash scripts/push_staging.sh

      - name: Ingest fast catalogs
        if: steps.staging_fast.outputs.pushed == 'true' && steps.fetch_fast.outputs.bridge_keys != ''
        env:
          BRIDGE_DISPATCH_TOKEN: ${{ secrets.BRIDGE_DISPATCH_TOKEN }}
          BRIDGE_REPO: ${{ secrets.BRIDGE_REPO }}
          BRIDGE_WORKFLOW: ${{ secrets.BRIDGE_WORKFLOW }}
          BRIDGE_REF: ${{ secrets.BRIDGE_REF }}
          BRIDGE_STORE_KEYS: ${{ steps.fetch_fast.outputs.bridge_keys }}
        run: python scripts/dispatch_bridge.py

      - name: Fetch slow catalogs (cookie path, 2 at a time)
        id: fetch_slow
        if: steps.fetch_fast.outcome == 'success' && steps.fetch_fast.outputs.slow_count != '0'
        env:
          CATALOG_PUSH_ON_FINISH: '1'
          STAGING_PUSH_TOKEN: ${{ secrets.STAGING_PUSH_TOKEN }}
          STAGING_REPO: ${{ secrets.STAGING_REPO }}
          STAGING_BRANCH: ${{ secrets.STAGING_BRANCH }}
          BRIDGE_DISPATCH_TOKEN: ${{ secrets.BRIDGE_DISPATCH_TOKEN }}
          BRIDGE_REPO: ${{ secrets.BRIDGE_REPO }}
          BRIDGE_WORKFLOW: ${{ secrets.BRIDGE_WORKFLOW }}
          BRIDGE_REF: ${{ secrets.BRIDGE_REF }}
        run: |
          set -euo pipefail
          set +e
          python -m src.fetch_all --out-dir .out --phase slow --slow-queue .out/_slow_queue.json
          set -e
          ls -la .out || true
          python - <<'PY'
          import json
          from pathlib import Path
          st = {}
          p = Path(".out/_fetch_status.json")
          if p.exists():
              st = json.loads(p.read_text(encoding="utf-8"))
          print(f"slow status ok={st.get('ok')} failed={st.get('failed')}")
          keys = Path(".out/_bridge_keys.txt")
          print(f"slow bridge keys: {(keys.read_text(encoding='utf-8') if keys.exists() else '')}")
          PY
          echo "bridge_keys=$(cat .out/_bridge_keys.txt 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Push slow catalogs to staging
        id: staging_slow
        if: steps.fetch_slow.outcome == 'success'
        env:
          STAGING_PUSH_TOKEN: ${{ secrets.STAGING_PUSH_TOKEN }}
          STAGING_REPO: ${{ secrets.STAGING_REPO }}
          STAGING_BRANCH: ${{ secrets.STAGING_BRANCH }}
        run: bash scripts/push_staging.sh

      - name: Ingest slow catalogs
        if: steps.staging_slow.outputs.pushed == 'true' && steps.fetch_slow.outputs.bridge_keys != ''
        env:
          BRIDGE_DISPATCH_TOKEN: ${{ secrets.BRIDGE_DISPATCH_TOKEN }}
          BRIDGE_REPO: ${{ secrets.BRIDGE_REPO }}
          BRIDGE_WORKFLOW: ${{ secrets.BRIDGE_WORKFLOW }}
          BRIDGE_REF: ${{ secrets.BRIDGE_REF }}
          BRIDGE_STORE_KEYS: ${{ steps.fetch_slow.outputs.bridge_keys }}
        run: python scripts/dispatch_bridge.py

      # upload-artifact respects .gitignore; .out/ is ignored, so copy first.
      - name: Stage artifacts for upload
        if: always()
        run: |
          set -euo pipefail
          rm -rf staged-catalogs
          mkdir -p staged-catalogs
          find .out -maxdepth 1 -type f -name '*.json' ! -name '_fetch_status.json' ! -name '_slow_queue.json' -exec cp -f {} staged-catalogs/ \;
          ls -la staged-catalogs

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-json
          path: staged-catalogs/
          if-no-files-found: warn

      - name: Report fetch outcome
        if: always()
        id: fetch
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(".out")
          status_path = out / "_fetch_status.json"
          fail_path = out / "_failures.json"
          catalogs = [p for p in out.glob("*.json") if not p.name.startswith("_")]
          st = {}
          if status_path.exists():
              st = json.loads(status_path.read_text(encoding="utf-8"))
          failures = []
          if isinstance(st.get("failures"), list):
              failures = [row for row in st["failures"] if isinstance(row, dict)]
          if not failures:
              for key in st.get("failed_keys") or []:
                  failures.append(
                      {
                          "key": key,
                          "retailer_key": key,
                          "error": "Catalog fetch failed",
                          "http_status": 0,
                          "final": True,
                      }
                  )
          for row in failures:
              row["final"] = True
          fail_path.write_text(
              json.dumps({"failures": failures, "final": True}, ensure_ascii=False),
              encoding="utf-8",
          )
          failed = int(st.get("failed") or 0)
          ok = int(st.get("ok") or 0)
          deferred = st.get("deferred_keys") or []
          print(f"final status ok={ok} failed={failed} deferred={deferred}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"partial_fail={'true' if failed else 'false'}\n")
          if not catalogs and failed == 0 and not deferred:
              raise SystemExit("No catalogs written and nothing deferred.")
          PY

      - name: Report partial fetch failures
        if: always() && steps.fetch.outputs.partial_fail == 'true'
        run: |
          echo "::warning::One or more stores failed. Successful catalogs were still staged and sent to ingest."
          if [ -f .out/_fetch_status.json ]; then
            python -c "import json; print(open('.out/_fetch_status.json',encoding='utf-8').read())"
          fi
          exit 1

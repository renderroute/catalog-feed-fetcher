name: Fetch public catalogs

on:
  schedule:
    # 04:00 IST (UTC+5:30) — offset from typical private nightly jobs around 02:00 IST
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      store:
        description: 'Optional single retailer key (empty = all enabled)'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch catalogs
        run: |
          set -euo pipefail
          EXTRA=""
          if [ -n "${{ github.event.inputs.store }}" ]; then
            EXTRA="--store ${{ github.event.inputs.store }}"
          fi
          mkdir -p .out
          python -m src.fetch_all --out-dir .out $EXTRA
          echo "Output directory:"
          ls -la .out
          test -n "$(ls -A .out/*.json 2>/dev/null)" || {
            echo "No JSON written under .out/ — check store key / fetch errors above."
            exit 1
          }

      # upload-artifact respects .gitignore; .out/ is ignored, so copy first.
      - name: Stage artifacts for upload
        run: |
          set -euo pipefail
          rm -rf staged-catalogs
          mkdir -p staged-catalogs
          cp -f .out/*.json staged-catalogs/
          ls -la staged-catalogs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catalog-json
          path: staged-catalogs/
          if-no-files-found: error

      # Pushes ONLY to a private staging repo. Never call a production website from here.
      # Note: GitHub forbids `secrets` inside `if:`; skip inside the script when unset.
      - name: Push JSON to private staging repo
        env:
          STAGING_PUSH_TOKEN: ${{ secrets.STAGING_PUSH_TOKEN }}
          STAGING_REPO: ${{ secrets.STAGING_REPO }}
          STAGING_BRANCH: ${{ secrets.STAGING_BRANCH }}
        run: |
          set -euo pipefail
          if [ -z "${STAGING_PUSH_TOKEN:-}" ] || [ -z "${STAGING_REPO:-}" ]; then
            echo "Skipping staging push (STAGING_PUSH_TOKEN / STAGING_REPO not set)."
            exit 0
          fi

          # Accept owner/name OR https://github.com/owner/name(.git)
          REPO="$(printf '%s' "$STAGING_REPO" | tr -d '\r\n')"
          REPO="${REPO#"${REPO%%[![:space:]]*}"}"
          REPO="${REPO%"${REPO##*[![:space:]]}"}"
          REPO="${REPO#https://github.com/}"
          REPO="${REPO#git@github.com:}"
          REPO="${REPO%.git}"
          REPO="${REPO%/}"

          BRANCH="$(printf '%s' "${STAGING_BRANCH:-}" | tr -d '\r\n')"
          BRANCH="${BRANCH#"${BRANCH%%[![:space:]]*}"}"
          BRANCH="${BRANCH%"${BRANCH##*[![:space:]]}"}"
          if [ -z "$BRANCH" ]; then
            BRANCH=main
          fi

          if ! printf '%s' "$REPO" | grep -Eq '^[^/[:space:]]+/[^/[:space:]]+$'; then
            echo "STAGING_REPO must be owner/name (e.g. myuser/pickpcparts-scraper)."
            echo "A full https://github.com/owner/name URL is also OK."
            exit 1
          fi

          echo "Staging clone target: github.com/${REPO} (branch ${BRANCH})"
          DAY=$(date -u +%Y-%m-%d)
          WORK=/tmp/staging-push
          rm -rf "$WORK"

          # Bearer header avoids breaking the URL if the token has special characters.
          git -c "http.extraheader=AUTHORIZATION: bearer ${STAGING_PUSH_TOKEN}" \
            clone --depth 1 --branch "$BRANCH" \
            "https://github.com/${REPO}.git" "$WORK"

          mkdir -p "$WORK/catalog-bridge/incoming/${DAY}"
          mkdir -p "$WORK/catalog-bridge/incoming/latest"
          cp -f .out/*.json "$WORK/catalog-bridge/incoming/${DAY}/"
          cp -f .out/*.json "$WORK/catalog-bridge/incoming/latest/"
          cd "$WORK"
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add catalog-bridge/incoming
          if git diff --cached --quiet; then
            echo "No catalog changes to commit"
          else
            git commit -m "catalog incoming ${DAY}"
            git -c "http.extraheader=AUTHORIZATION: bearer ${STAGING_PUSH_TOKEN}" \
              push origin "HEAD:${BRANCH}"
          fi
